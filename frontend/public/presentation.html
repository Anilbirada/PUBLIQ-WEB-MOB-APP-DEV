    :root {
      --bg: #0b0d11;
      --card-bg: #14171e;

      --gold-hover: #b8972b;
      --gold-light: rgba(212, 175, 55, 0.15);
      --white: #f5f5f7;
      --muted: #9da3af;
      --blue: #60a5fa;
      --green: #4ade80;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      height: 60px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(14, 16, 22, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--white);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-gold {
      background: var(--gold);
      color: #0b0d11;
      border: 1px solid var(--gold);
    }
    .btn-gold:hover {
      background: var(--gold-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--card-border);
    }
    .btn-ghost:hover {
      color: var(--white);
      border-color: var(--muted);
    }

    /* Stage / Slide Viewport */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .slide-frame {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 44px 56px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slide-tag::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }

    .slide-title {
      font-family: 'Cinzel', serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--white);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .slide-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .slide-body {
      flex: 1;
      display: grid;
      gap: 24px;
    }

    .grid-2 {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .panel {
      background: #0f1217;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
    }

    .panel-gold {
      border-color: rgba(212, 175, 55, 0.4);
    }
    .panel-blue {
      border-color: rgba(96, 165, 250, 0.4);
    }
    .panel-green {
      border-color: rgba(74, 222, 128, 0.4);
    }
    .panel-red {
      border-color: rgba(248, 113, 113, 0.4);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--white);
    }

    .panel-sub {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bullets li {
      font-size: 12.5px;
      color: #d1d5db;
      line-height: 1.5;
      position: relative;
      padding-left: 18px;
    }
    .bullets li::before {
      content: "•";
      position: absolute;
      left: 2px;
      color: var(--gold);
      font-size: 18px;
      line-height: 1;
    }

    .title-stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      border-left: 4px solid var(--gold);
      padding-left: 36px;
    }
    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .hero-sub {
      font-size: 24px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 16px;
    }
    .hero-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 700px;
      margin-bottom: 28px;
    }
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--gold-light);
      border: 1px solid var(--gold);
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      width: fit-content;
    }

    /* Bottom Control Bar */

      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--card-border);
      background: rgba(14, 16, 22, 0.85);

      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      font-mono: monospace;

    .slide-counter span {
      color: var(--gold);

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .key-hint {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .key-badge {
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e222d;
      border: 1px solid var(--card-border);
      font-size: 10px;
      font-family: monospace;
      color: var(--white);

    let currentIdx = 0;

    function renderSlide() {
      const s = slides[currentIdx];
      const container = document.getElementById("slide-container");
      document.getElementById("current-slide").innerText = currentIdx + 1;
      document.getElementById("total-slides").innerText = slides.length;

      if (s.type === "cover") {
        container.innerHTML = `
          <div class="title-stage">
            <h1 class="hero-title">${s.title}</h1>
            <h2 class="hero-sub">${s.subtitle}</h2>
            <p class="hero-desc">${s.desc}</p>
            <div class="hero-pill">${s.pill}</div>
          </div>
        `;
        return;
      }

      let panelsHtml = "";
      s.panels.forEach(p => {
        let bulletsHtml = p.bullets.map(b => `<li>${b}</li>`).join("");
        panelsHtml += `
          <div class="panel ${p.border || ''}">
            <div class="panel-title">${p.title}</div>
            <div class="panel-sub">${p.sub}</div>
            <ul class="bullets">
              ${bulletsHtml}
            </ul>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="slide-tag">${s.tag}</div>
        <div class="slide-title">${s.title}</div>
        <div class="slide-subtitle">${s.subtitle}</div>
        <div class="slide-body ${s.grid}">
          ${panelsHtml}
        </div>
      `;
    }

    function nextSlide() {
      if (currentIdx < slides.length - 1) {
        currentIdx++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        renderSlide();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      }
    });

    renderSlide();
  </script>
