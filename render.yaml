services:
  # =========================================================================
  # 1. FASTAPI BACKEND (Python 3.12 Web Service)
  # =========================================================================
  - type: web
    name: publiq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: QR_TOKEN_SALT
        generateValue: true
      - key: POS_INTEGRATION_MODE
        value: LOCAL_EMULATOR
      - key: SQL_ECHO
        value: "false"

  # =========================================================================
  # 2. NEXT.JS LUXURY FRONTEND (Node.js 20 Web Service)
  # =========================================================================
  - type: web
    name: publiq-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: publiq-backend
          property: host
