<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#E5C378" />
      <stop offset="100%" stop-color="#A37B34" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Crest Icon -->
  <g transform="translate(20, 10)">
    <circle cx="50" cy="50" r="46" fill="#0A111F" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3, 3" opacity="0.6" />
    <!-- Monogram P -->
    <path d="M 40 28 L 54 28 C 64 28, 70 34, 70 42 C 70 50, 64 56, 54 56 L 47 56 L 47 72 L 40 72 Z M 47 35 L 47 49 L 53 49 C 59 49, 62 46, 62 42 C 62 38, 59 35, 53 35 Z" fill="url(#goldGrad)" />
    <!-- Star Accent -->
    <polygon points="50,18 52,22 56,22 53,24 54,28 50,26 46,28 47,24 44,22 48,22" fill="#E5C378" />
  </g>
  
  <!-- Typography -->
  <text x="145" y="62" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" letter-spacing="8" fill="url(#goldGrad)">
    PUBLIQ
  </text>
  <text x="148" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#EDE8DC" opacity="0.9">
    BAR &amp; RESTAURANT
  </text>
  
  <!-- Divider Line -->
  <line x1="148" y1="98" x2="380" y2="98" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
</svg>
